<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正方形紙張摺痕模擬器</title><style>body{font-family:system-ui,'Noto Sans TC',sans-serif;background:#f5f7fb;color:#182338;margin:0;padding:20px}main{max-width:720px;margin:auto}h1{font-size:1.6rem}button{border:0;border-radius:9px;padding:12px 17px;background:#244f94;color:white;font-size:1rem;cursor:pointer;margin:4px}button:disabled{opacity:.4}button.secondary{background:#64748b}.panels{display:grid;grid-template-columns:1fr;gap:16px;margin-top:18px}.panel{background:white;padding:16px;border-radius:14px;box-shadow:0 2px 12px #0001}svg{width:100%;height:auto;display:block}.muted{color:#58657a}.zoom-controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}.zoom-controls button{padding:8px 12px;margin:0}.zoom-controls input{flex:1;min-width:90px}.zoom-controls label{font-size:.9rem}#open{touch-action:none;cursor:grab;user-select:none}#open.dragging{cursor:grabbing}.query-controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap}.query-controls label{display:flex;flex-direction:column;gap:5px;font-weight:600}.query-controls input{width:85px;padding:9px;border:1px solid #94a3b8;border-radius:7px;font-size:1rem}.edge-table{border-collapse:collapse;width:100%;margin-top:10px}.edge-table th,.edge-table td{border-bottom:1px solid #e2e8f0;padding:9px;text-align:left}.edge-table th{width:25%}.selected-info{font-size:.95rem;color:#475569}.legend{display:flex;gap:20px;flex-wrap:wrap}.red{color:#d63842}.blue{color:#2563eb}#history{overflow-wrap:anywhere}@media(max-width:700px){.panels{grid-template-columns:1fr}body{padding:12px}}</style></head><body><main><h1>正方形紙張摺痕模擬器</h1><p class="muted">從正面朝上的正方形開始。每次將目前紙張的下半部向上、或右半部向左對折；下圖顯示從原始正面觀看、完全攤平後的摺痕。最多可對折 16 次；可縮放及拖曳摺痕圖查看細節。</p><div><button id="up">↑ 向上對折</button><button id="left">← 向左對折</button><button id="undo" class="secondary">↶ 復原一步</button><button id="reset" class="secondary">重新開始</button></div><div class="panels"><section class="panel"><h2>完全展開的摺痕</h2><div class="zoom-controls"><button id="zoomOut" class="secondary" aria-label="縮小">－</button><label for="zoomRange">放大倍率 <output id="zoomLabel">100%</output></label><input id="zoomRange" type="range" min="1" max="16" step="0.25" value="1"><button id="zoomIn" class="secondary" aria-label="放大">＋</button><button id="zoomReset" class="secondary">重設視角</button></div><svg id="open" viewBox="0 0 440 440" aria-label="展開摺痕"><rect width="440" height="440" fill="#f8fafc"/></svg><section aria-label="矩形邊界查詢"><h3>指定矩形邊界（矩陣座標）</h3><p class="muted">左上角為 (0,0)；i 為由上往下的列索引，j 為由左往右的行索引。</p><div class="query-controls"><label for="cellRow">列 i<input id="cellRow" type="number" min="0" value="0" step="1" inputmode="numeric"></label><label for="cellCol">行 j<input id="cellCol" type="number" min="0" value="0" step="1" inputmode="numeric"></label><button id="queryCell">查詢矩形</button></div><p id="cellRange" class="selected-info"></p><p id="cellStatus" role="status"></p><table class="edge-table"><thead><tr><th>邊界</th><th>摺痕類型</th></tr></thead><tbody id="edgeResults"></tbody></table></section><div class="legend"><span class="red">━━ 山摺（紅色）</span><span class="blue">┄┄ 谷摺（藍色）</span></div><p id="counts" class="muted"></p></section></div><p><strong>摺疊紀錄：</strong><span id="history">尚未摺疊</span></p><p class="muted">約定：從紙張最初的正面觀察，摺線凸起為山摺、凹下為谷摺。每次摺疊時，移動半部向觀看者翻到固定半部上方。摺痕顏色表示攤平後沿用此摺法所形成的山谷方向。</p></main><script>
const NS='http://www.w3.org/2000/svg';let steps=[];let zoom=1,centerX=220,centerY=220;const $=id=>document.getElementById(id);
function el(tag,attrs,parent){let e=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e;}
// Each original micro-cell tracks its current position and whether its original front faces up.
// At a fold, the stationary/moving layers meet at the hinge; valley on the current upward-facing side,
// mountain on the reverse. The crease on each original edge inherits that cell's face parity.
function compute(){let nx=2**steps.filter(d=>d==='L').length,ny=2**steps.filter(d=>d==='U').length;let cells=[];for(let y=0;y<ny;y++)for(let x=0;x<nx;x++)cells.push({x,y,cx:x,cy:y,face:1,sx:1,sy:1});let W=nx,H=ny,segments=[];
for(let d of steps){let vertical=d==='L',cut=(vertical?W:H)/2;
for(let c of cells){let moving=vertical?c.cx>=cut:c.cy>=cut;if(!moving)continue;
// Every moving layer along the hinge creates one crease on its own original square.
if(vertical && c.cx===cut){let xx=c.sx===1?c.x:c.x+1;segments.push({x1:xx,y1:c.y,x2:xx,y2:c.y+1,mountain:c.face<0});}
if(!vertical && c.cy===cut){let yy=c.sy===1?c.y:c.y+1;segments.push({x1:c.x,y1:yy,x2:c.x+1,y2:yy,mountain:c.face<0});}
}
for(let c of cells){let moving=vertical?c.cx>=cut:c.cy>=cut;if(moving){if(vertical){c.cx=2*cut-1-c.cx;c.sx*=-1;}else{c.cy=2*cut-1-c.cy;c.sy*=-1;}c.face*=-1;}}
if(vertical)W=cut;else H=cut;
}
return {nx,ny,segments};}
let selectedRow=0,selectedCol=0;function edgeType(map,x1,y1,x2,y2,nx,ny){if(x1===x2&&(x1===0||x1===nx)||y1===y2&&(y1===0||y1===ny))return "紙張外邊界";let key=[x1,y1,x2,y2].join(",");let s=map.get(key);return s?(s.mountain?"山線 M":"谷線 V"):"無摺痕";}
function render(){let {nx,ny,segments}=compute(),svg=$('open');svg.replaceChildren();el('rect',{x:20,y:20,width:400,height:400,fill:'#fff',stroke:'#253247','stroke-width':2},svg);
// Draw every distinct segment; segments are generated only on true original-neighbor hinges.
let dedup=new Map();for(let s of segments){let key=[s.x1,s.y1,s.x2,s.y2].join(',');dedup.set(key,s);}let m=0,v=0;for(let s of dedup.values()){s.mountain?m++:v++;el('line',{x1:20+400*s.x1/nx,y1:20+400*s.y1/ny,x2:20+400*s.x2/nx,y2:20+400*s.y2/ny,stroke:s.mountain?'#d63842':'#2563eb','stroke-width':2.5,'stroke-dasharray':s.mountain?'':'7 5'},svg);}
// Show the selected micro-rectangle in matrix (row, column) coordinates.
$('cellRow').max=ny-1;$('cellCol').max=nx-1;
selectedRow=Math.max(0,Math.min(ny-1,selectedRow));selectedCol=Math.max(0,Math.min(nx-1,selectedCol));
$('cellRow').value=selectedRow;$('cellCol').value=selectedCol;
let i=selectedRow,j=selectedCol;
el('rect',{x:20+400*j/nx,y:20+400*i/ny,width:400/nx,height:400/ny,fill:'#facc15','fill-opacity':'.22',stroke:'#d4a000','stroke-width':Math.max(1.5,Math.min(4,150/Math.max(nx,ny)))},svg);
$('cellRange').textContent='目前格數：'+ny+' 列 × '+nx+' 行；有效座標：i = 0～'+(ny-1)+'，j = 0～'+(nx-1);
$('cellStatus').textContent='已選取矩形 ('+i+','+j+')';
let sides=[['上',j,i,j+1,i],['右',j+1,i,j+1,i+1],['下',j,i+1,j+1,i+1],['左',j,i,j,i+1]];
$('edgeResults').replaceChildren();
for(let [name,x1,y1,x2,y2] of sides){let tr=document.createElement('tr'),th=document.createElement('th'),td=document.createElement('td');th.textContent=name;td.textContent=edgeType(dedup,x1,y1,x2,y2,nx,ny);tr.append(th,td);$('edgeResults').appendChild(tr);}
updateView();$('counts').textContent=`山摺線段 ${m}，谷摺線段 ${v}；合計 ${m+v} 段（以最小格線段計）。`;$('history').textContent=steps.length?steps.map((s,i)=>`${i+1}. ${s==='U'?'向上':'向左'}`).join(' → '):'尚未摺疊';$('undo').disabled=!steps.length;$('up').disabled=$('left').disabled=steps.length>=16;}
function updateView(){let side=440/zoom,half=side/2;centerX=Math.max(half,Math.min(440-half,centerX));centerY=Math.max(half,Math.min(440-half,centerY));$('open').setAttribute('viewBox',`${centerX-half} ${centerY-half} ${side} ${side}`);$('zoomRange').value=zoom;$('zoomLabel').textContent=Math.round(zoom*100)+'%';$('zoomOut').disabled=zoom<=1;$('zoomIn').disabled=zoom>=16;}
function setZoom(z){zoom=Math.max(1,Math.min(16,z));updateView();}
$('zoomRange').oninput=e=>setZoom(Number(e.target.value));$('zoomIn').onclick=()=>setZoom(zoom*1.5);$('zoomOut').onclick=()=>setZoom(zoom/1.5);$('zoomReset').onclick=()=>{zoom=1;centerX=centerY=220;updateView();};
let drag=null;const canvas=$('open');canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,cx:centerX,cy:centerY};canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');});canvas.addEventListener('pointermove',e=>{if(!drag)return;let r=canvas.getBoundingClientRect(),side=440/zoom;centerX=drag.cx-(e.clientX-drag.x)*side/r.width;centerY=drag.cy-(e.clientY-drag.y)*side/r.height;updateView();});function endDrag(){drag=null;canvas.classList.remove('dragging');}canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);canvas.addEventListener('lostpointercapture',endDrag);
$('queryCell').onclick=()=>{let i=Number($('cellRow').value),j=Number($('cellCol').value),ny=2**steps.filter(d=>d==='U').length,nx=2**steps.filter(d=>d==='L').length;if(!Number.isInteger(i)||!Number.isInteger(j)||i<0||j<0||i>=ny||j>=nx){$('cellStatus').textContent='座標無效：請輸入有效範圍內的整數。';return;}selectedRow=i;selectedCol=j;render();};$('cellRow').addEventListener('keydown',e=>{if(e.key==='Enter')$('queryCell').click()});$('cellCol').addEventListener('keydown',e=>{if(e.key==='Enter')$('queryCell').click()});
$('up').onclick=()=>{steps.push('U');render()};$('left').onclick=()=>{steps.push('L');render()};$('undo').onclick=()=>{steps.pop();render()};$('reset').onclick=()=>{steps=[];render()};render();
</script></body></html>
